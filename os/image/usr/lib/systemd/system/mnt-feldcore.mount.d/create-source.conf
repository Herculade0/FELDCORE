# The fstab bind is ordered After=var-lib-feldcore.mount by
# x-systemd.requires=. ExecStartPre then creates the source directory
# before the bind itself. A tmpfiles.d entry cannot do that: tmpfiles
# setup runs after local-fs.target, and child mounts such as
# /mnt/feldcore/data are local-fs mounts that need this parent first.
[Service]
ExecStartPre=/bin/mkdir -p -m 0755 /var/lib/feldcore/mnt
