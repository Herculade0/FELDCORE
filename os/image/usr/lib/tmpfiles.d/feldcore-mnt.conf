# Source directory of the /mnt/feldcore bind. systemd-tmpfiles-setup.service
# is After=local-fs.target, so this line runs too late to create the
# directory before that bind. mnt-feldcore.mount's ExecStartPre creates it
# first; this entry keeps the mode if the directory is missing later.
d /var/lib/feldcore/mnt 0755 root root -
