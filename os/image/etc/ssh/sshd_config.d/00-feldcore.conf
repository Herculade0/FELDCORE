# SSH is public-key only. The root password stays locked, and this file
# must not set PermitRootLogin to yes. sshd is disabled until an install
# answer file enables it. Debian reads this directory before sshd_config,
# and the first value wins.
PermitRootLogin prohibit-password
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
AuthorizedKeysFile /etc/ssh/authorized_keys/%u .ssh/authorized_keys
