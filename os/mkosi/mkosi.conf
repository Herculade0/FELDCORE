# Root filesystem for FELDCORE OS. The disk layout (A/B slots, ESP, state
# partition) is assembled by os/build.sh. This config builds the directory
# tree mkosi would install. Select it with FELDCORE_IMAGE_BUILDER=mkosi.
# The default build uses debootstrap and the same package list.

[Distribution]
Distribution=debian
Release=trixie

[Output]
Format=directory
Output=rootfs
ImageId=feldcore
ImageVersion=0.1.0

[Content]
Bootable=no
WithNetwork=yes
WithDocs=no
Packages=
        systemd
        systemd-sysv
        systemd-boot
        systemd-boot-efi
        systemd-timesyncd
        linux-image-amd64
        dbus
        ca-certificates
        iproute2
        iptables
        kmod
        e2fsprogs
        dosfstools
        gdisk
        parted
        zstd
        firmware-linux-free
        firmware-amd-graphics
        firmware-intel-graphics
        firmware-misc-nonfree
        tzdata
        bash
        curl
        git
        procps
        util-linux
        pciutils
        docker.io
        docker-cli
        containerd
        docker-compose
        samba
        nfs-kernel-server
        restic
        rclone
        cifs-utils
        wireguard-tools
        smartmontools
        mdadm
        btrfs-progs
        xfsprogs
        hdparm
        ufw
        rtl-sdr
