# Builds release binaries when a version tag is pushed. It does not run on
# ordinary commits, and nothing here publishes a release until you push a tag.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.11"

      - name: Build the web UI
        run: |
          version="${GITHUB_REF_NAME#v}"
          npm --prefix web ci
          VITE_FELDCORE_VERSION="${version}" npm --prefix web run build

      - name: Build Linux binaries
        run: |
          version="${GITHUB_REF_NAME#v}"
          ldflags="-s -w -X github.com/Herculade0/feldcore/internal/version.Current=${version}"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "${ldflags}" -o dist/feldcored-linux-amd64 ./cmd/feldcored
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags "${ldflags}" -o dist/feldcored-linux-arm64 ./cmd/feldcored
          cp deploy/feldcore.service deploy/get.sh dist/

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/feldcored-linux-amd64
            dist/feldcored-linux-arm64
            dist/feldcore.service
            dist/get.sh
          generate_release_notes: true
