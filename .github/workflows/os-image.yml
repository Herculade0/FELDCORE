# Builds the FELDCORE OS disk and installer images when a version tag is
# pushed. It does not create the tag. Publishing the GitHub Release assets
# requires the FELDCORE_UPDATE_SIGNING_KEY secret: the unencrypted signing
# key produced by `osmanifest genkey`. Without that secret the image is still
# built and uploaded as a workflow artifact, and the job then fails so an
# unsigned release is not published.
name: OS image

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.11"

      - name: Install image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            debootstrap debian-archive-keyring \
            gdisk dosfstools e2fsprogs mtools zstd \
            qemu-utils rsync

      - name: Write the signing key outside the repository
        env:
          FELDCORE_UPDATE_SIGNING_KEY: ${{ secrets.FELDCORE_UPDATE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          umask 077
          if [[ -n ${FELDCORE_UPDATE_SIGNING_KEY} ]]; then
            printf '%s\n' "${FELDCORE_UPDATE_SIGNING_KEY}" > "${RUNNER_TEMP}/update.key"
            echo "FELDCORE_UPDATE_KEY=${RUNNER_TEMP}/update.key" >> "${GITHUB_ENV}"
          else
            echo "The signing secret is not set. The image will be built with an ephemeral key and will not be published."
          fi

      - name: Build the image
        run: ./os/build.sh

      - name: Refuse a private key in the output
        run: |
          if find dist/os -name '*.key' -o -name '*.sec' | grep -q .; then
            echo "A private key was written into dist/os." >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: feldcore-os
          path: |
            dist/os/feldcore-os.raw.zst
            dist/os/feldcore-installer.raw.zst
            dist/os/feldcore-root.img.zst
            dist/os/vmlinuz
            dist/os/initrd.img
            dist/os/feldcore-os.json
            dist/os/feldcore-os.json.minisig
            dist/os/update.pub
          if-no-files-found: error

      - name: Require the signing key before publishing
        env:
          FELDCORE_UPDATE_SIGNING_KEY: ${{ secrets.FELDCORE_UPDATE_SIGNING_KEY }}
        run: |
          if [[ -z ${FELDCORE_UPDATE_SIGNING_KEY} ]]; then
            echo "FELDCORE_UPDATE_SIGNING_KEY is not set. The image artifact was uploaded. Refusing to publish a release signed by an ephemeral key." >&2
            exit 1
          fi

      - name: Publish the image on the tag's release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/os/feldcore-os.raw.zst
            dist/os/feldcore-installer.raw.zst
            dist/os/feldcore-root.img.zst
            dist/os/vmlinuz
            dist/os/initrd.img
            dist/os/feldcore-os.json
            dist/os/feldcore-os.json.minisig
            dist/os/update.pub
